project:
  name: "hype-topic-detection"
  wandb_logging: true
  seed: 42

paths:
  data: "./data/dataset_v2.xlsx"
  taxonomy: "./data/taxonomy_v2.xlsx"
  cache: "./data/cached_preprocessed_data.pkl"
  output_topics: "./out/results_topics.xlsx"
  output_mapping: "./out/taxonomy_comparison.xlsx"

preprocessing:
  use_cache: true
  # Reviews with fewer than this many words are considered junk
  min_word_count: 3
  # Duplicate removal threshold (0.90 - 0.95 recommended)
  dedup_threshold: 0.92

translation:
  # Batch size for translation (can be lower than sentiment if GPU memory is tight)
  batch_size: 16

  # Max length for the generated text
  max_length: 128

  # Models
  detection_model: "papluca/xlm-roberta-base-language-detection"
  translation_model: "facebook/nllb-200-distilled-600M"

  # Target language code for NLLB (Italian)
  target_lang: "ita_Latn"

  # Mapping: ISO-2 (Detector Output) -> NLLB Code (Translator Input)
  # Covers common European & World languages
  iso_to_nllb_mapping:
    # Supported by papluca model (20 langs)
    ar: "arb_Arab" # Arabic
    bg: "bul_Cyrl" # Bulgarian
    de: "deu_Latn" # German
    el: "ell_Grek" # Greek
    en: "eng_Latn" # English
    es: "spa_Latn" # Spanish
    fr: "fra_Latn" # French
    hi: "hin_Deva" # Hindi
    it: "ita_Latn" # Italian
    ja: "jpn_Jpan" # Japanese
    nl: "nld_Latn" # Dutch
    pl: "pol_Latn" # Polish
    pt: "por_Latn" # Portuguese
    ru: "rus_Cyrl" # Russian
    sw: "swh_Latn" # Swahili
    th: "tha_Thai" # Thai
    tr: "tur_Latn" # Turkish
    ur: "urd_Arab" # Urdu
    vi: "vie_Latn" # Vietnamese
    zh: "zho_Hans" # Chinese (Simplified)

    # Extras (Common in EU) - in case detector is swapped/upgraded
    cs: "ces_Latn" # Czech
    da: "dan_Latn" # Danish
    et: "est_Latn" # Estonian
    fi: "fin_Latn" # Finnish
    ga: "gle_Latn" # Irish
    hr: "hrv_Latn" # Croatian
    hu: "hun_Latn" # Hungarian
    lt: "lit_Latn" # Lithuanian
    lv: "lav_Latn" # Latvian
    mt: "mlt_Latn" # Maltese
    ro: "ron_Latn" # Romanian
    sk: "slk_Latn" # Slovak
    sl: "slv_Latn" # Slovenian
    sv: "swe_Latn" # Swedish
    uk: "ukr_Cyrl" # Ukrainian
    no: "nob_Latn" # Norwegian (Bokmal)
    id: "ind_Latn" # Indonesian
    ko: "kor_Hang" # Korean

sentiment:
  # Models used in the ensemble
  feelit_model: "MilaNLProc/feel-it-italian-sentiment"
  xlm_model: "cardiffnlp/twitter-xlm-roberta-base-sentiment"
  batch_size: 16

topic_modeling:
  # Options: "multilingual" (SOTA) or "italian"
  language: "multilingual"
  model_choice: "multilingual"
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  # language: "italian"
  # model_choice: "italian_sbert"
  # embedding_model: "nickprock/sentence-bert-base-italian-uncased"

  # Dimensionality Reduction
  #UMAP
  umap:
    n_neighbors: 15
    n_components: 5
    min_dist: 0.0
    metric: "cosine"
  #KernelPCA
  kernel_pca:
    n_components: 5        
    kernel: rbf  

  # Clustering
  # HBDSCAN
  # If you get < 10 topics: Lower min_cluster_size in config.yaml (e.g., try 10 or 7).
  # If you get > 50 topics: Increase min_cluster_size to merge smaller micro-clusters.
  hdbscan:
    min_cluster_size: 20
    cluster_selection_method: "eom"
  #K-means
  kmeans:
    n_clusters: 30
  #Spectral clustering
  spectral:
    n_clusters: 15

  # Vectorizer
  min_df: 2

  # Custom Stopwords
  extra_stopwords:
    - "app"
    - "applicazione"
    - "hype"
    - "solo"
    - "sempre"
    - "fatto"
    - "fare"
    - "avere"
    - "essere"
    - "paga"
    - "conto"
    - "banca"

baselines:
  n_topics: 10
  n_top_words: 15
  random_state: 42
